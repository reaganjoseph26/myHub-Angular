<div class="menu-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="user-avatar"></div>
      <div class="user-info">
        <span class="user-name">{{userData.username}}</span>
        @if(userData.email != '') {

        <span class="user-email">{{userData.email}}</span>
        }
      </div>
    </div>
    <nav>
      <a routerLink="/home" class="menu-item">Home</a>
      <a [routerLink]="['/hub/', userData.username.trim()]" class="menu-item"
        >My Hub</a
      >

      <a
        [routerLink]="['/profile/', userData.username.trim()]"
        class="menu-item"
        >Profile</a
      >
      <a class="menu-item">Network</a>
      <a class="menu-item">Projects</a>
      <a
        id="favorites"
        class="menu-item"
        [routerLink]="['/favorites/', userData.username.trim()]"
        >Favorites</a
      >
    </nav>

    <div class="user-options">
      <a id="settings" [routerLink]="['/settings/', userData.username.trim()]"
        >Settings</a
      >

      <a (click)="logOut()"> Logout</a>
    </div>
  </aside>
</div>
