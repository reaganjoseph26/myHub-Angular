<div class="menu-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="user-avatar"></div>
      <div class="user-info">
        <span class="user-name">{{userData.username}}</span>
        @if(userData.email != '') {

        <span class="user-email">{{userData.email}}</span>
        }
      </div>
    </div>
    <nav>
      <a
        routerLink="/home"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
        >Home</a
      >
      @if (userData && userData.username) {
      <a
        [routerLink]="['/hub/',userData.username.trim()]"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
        >My Hub</a
      >
      <a
        [routerLink]="['/network']"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
        >Network</a
      >
      <a
        [routerLink]="['/projects']"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
        >Projects</a
      >

      <a
        id="favorites"
        class="menu-item"
        [routerLink]="['/favorites/', userData.username.trim()]"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        >Favorites</a
      >
      }
    </nav>

    <div class="user-options">
      @if (userData && userData.username) {
      <a
        id="settings"
        [routerLink]="['/settings/', userData.username.trim()]"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        >Settings</a
      >
      }

      <a (click)="logOut()"> Logout</a>
    </div>
  </aside>
</div>
